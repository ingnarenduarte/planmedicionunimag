<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" id="viewportMeta" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Interactivo medidores Universidad del Magdalena</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>

    <style>
        * { box-sizing: border-box; }
        html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #020617; color: #fff; font-family: 'Inter', system-ui, sans-serif; user-select: none; -webkit-user-select: none; touch-action: none; }
        #canvas { position: fixed; inset: 0; z-index: 1; }
        #canvas canvas { display: block; outline: none; }
        #ui { position: fixed; inset: 0; z-index: 20; pointer-events: none; }
        .interactive { pointer-events: auto; }
        
        .glass { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4); }
        .sidebar { width: 100%; max-width: 380px; height: 100%; transform: translateX(-105%); transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1); pointer-events: auto; display: flex; flex-direction: column; position: absolute; top: 0; left: 0; }
        .sidebar.open { transform: translateX(0); }
        .scroll { overflow-y: auto; overflow-x: hidden; }
        .scroll::-webkit-scrollbar { width: 6px; height: 6px; }
        .scroll::-webkit-scrollbar-thumb { background: rgba(59, 130, 246, 0.5); border-radius: 10px; }

        .modal-overlay { position: fixed; inset: 0; z-index: 200; display: flex; align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(10px); opacity: 0; pointer-events: none; transition: opacity 0.3s; padding: 10px; }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        
        #toast-container { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%); z-index: 9999; display: flex; flex-direction: column; gap: 10px; pointer-events: none; width: 90%; max-width: 350px; }
        .toast { background: rgba(15, 23, 42, 0.95); border: 1px solid rgba(59, 130, 246, 0.4); color: white; padding: 12px 20px; border-radius: 50px; font-size: 13px; font-weight: 500; box-shadow: 0 10px 30px rgba(0,0,0,0.5); animation: toast-in 0.3s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; display: flex; justify-content: center; text-align: center; }
        @keyframes toast-in { from { opacity: 0; transform: translateY(20px) scale(0.9); } to { opacity: 1; transform: translateY(0) scale(1); } }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div id="canvas"></div>
    <div id="labels" class="fixed inset-0 z-10 pointer-events-none overflow-hidden"></div>
    <div id="toast-container"></div>
    
    <!-- Brújula Dinámica -->
    <div id="compass" class="fixed top-24 right-4 md:right-6 w-12 h-12 md:w-14 md:h-14 glass rounded-full flex flex-col items-center justify-center z-20 shadow-2xl pointer-events-none border border-blue-500/40 bg-black/60">
        <span class="text-[9px] md:text-[10px] font-bold text-blue-500 mb-0.5 leading-none">N</span>
        <i id="compassNeedle" class="fas fa-location-arrow text-white text-lg md:text-xl transform -rotate-45 transition-transform duration-75 origin-center"></i>
    </div>

    <!-- Botones Toggle Barras -->
    <button id="btnMaximizeAdmin" class="hidden fixed top-1/2 left-0 -translate-y-1/2 z-40 glass bg-blue-600 hover:bg-blue-500 text-white p-3 md:p-4 rounded-r-2xl border-y border-r border-blue-400 interactive transition-all group">
        <i class="fas fa-tools mb-1 block text-xs"></i>
        <i class="fas fa-chevron-right group-hover:translate-x-1 transition-transform"></i>
    </button>

    <button id="btnOpenPublicSidebar" class="fixed top-1/3 left-0 -translate-y-1/2 z-20 glass bg-blue-600/80 hover:bg-blue-500 text-white p-3 md:p-4 rounded-r-2xl border-y border-r border-blue-400 interactive transition-all group cursor-pointer flex flex-col items-center">
        <i class="fas fa-list-ul mb-1 block text-sm"></i>
    </button>

    <!-- Modal Galería Interactiva (Modo Administrador Edición) -->
    <div id="fullGalleryModal" class="modal-overlay interactive" onclick="if(event.target === this) closeGalleryModal()">
        <div class="relative w-full h-full flex items-center justify-center p-2 md:p-4 flex-col">
            <!-- Barra Superior de la Galería -->
            <div class="absolute top-4 left-4 right-4 flex justify-between items-center z-30">
                <div id="galleryCounter" class="bg-black/80 px-4 py-1.5 rounded-full text-xs font-bold border border-blue-500/30 text-white shadow-lg">0 / 0</div>
                <div class="flex gap-2">
                    <!-- Botón para añadir imagen en modo Admin -->
                    <button id="btnAdminAddImg" class="hidden bg-green-600 hover:bg-green-500 text-white rounded-full px-4 py-2 text-xs font-bold transition-colors shadow-xl border border-green-400 flex items-center gap-1" onclick="triggerAddGalleryImg()">
                        <i class="fas fa-plus"></i> Añadir Imagen
                    </button>
                    <!-- Botón para eliminar la imagen actual en modo Admin -->
                    <button id="btnAdminDeleteImg" class="hidden bg-red-600 hover:bg-red-500 text-white rounded-full px-4 py-2 text-xs font-bold transition-colors shadow-xl border border-red-400 flex items-center gap-1" onclick="deleteCurrentGalleryImg()">
                        <i class="fas fa-trash"></i> Eliminar
                    </button>
                    <button class="text-white bg-gray-800 hover:bg-gray-700 rounded-full w-10 h-10 flex items-center justify-center transition-colors shadow-xl border border-white/20" onclick="closeGalleryModal()">
                        <i class="fas fa-times text-lg"></i>
                    </button>
                </div>
            </div>

            <!-- Visor de Imagen -->
            <div class="relative max-w-full max-h-[85vh] flex items-center justify-center">
                <img id="fullGalleryImg" src="" class="max-w-full max-h-[80vh] object-contain rounded-xl shadow-2xl border-2 border-blue-500/50">
            </div>

            <!-- Navegación Galería -->
            <button id="btnPrevImg" class="absolute top-1/2 left-2 md:left-4 -translate-y-1/2 w-10 h-10 md:w-14 md:h-14 glass bg-black/60 rounded-full flex items-center justify-center hover:bg-blue-500 transition-colors shadow-xl" onclick="navigateGallery(-1)">
                <i class="fas fa-chevron-left text-xl text-white"></i>
            </button>
            <button id="btnNextImg" class="absolute top-1/2 right-2 md:right-4 -translate-y-1/2 w-10 h-10 md:w-14 md:h-14 glass bg-black/60 rounded-full flex items-center justify-center hover:bg-blue-500 transition-colors shadow-xl" onclick="navigateGallery(1)">
                <i class="fas fa-chevron-right text-xl text-white"></i>
            </button>

            <!-- Input Oculto para Cargar Nuevas Imágenes -->
            <input type="file" id="adminGalleryFileInput" accept="image/jpeg, image/png" class="hidden" onchange="handleAdminGalleryUpload(event)">
        </div>
    </div>

    <!-- Info Hotspot Modal -->
    <div id="infoHotspotModal" class="modal-overlay interactive" onclick="if(event.target === this) this.classList.remove('active')">
        <div class="glass rounded-2xl p-6 w-[95%] max-w-sm border border-blue-500/30 shadow-2xl bg-black/90 text-center">
            <h2 id="hsModalTitle" class="text-xl font-bold text-white mb-4 border-b border-white/10 pb-2"></h2>
            <div class="flex gap-2">
                <button id="hsModalBtnGallery" class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl py-2.5 text-xs font-bold transition-colors" onclick="openGalleryFromModal()"><i class="fas fa-images mr-1"></i> Galería</button>
            </div>
            <button class="mt-3 w-full bg-gray-700 hover:bg-gray-600 text-white rounded-xl py-2.5 text-sm font-bold transition-colors" onclick="document.getElementById('infoHotspotModal').classList.remove('active')">Cerrar</button>
        </div>
    </div>

    <div id="ui" class="flex">
        <!-- BARRA LATERAL PÚBLICA -->
        <aside id="publicSidebar" class="sidebar glass z-50 border-r border-blue-500/30 bg-slate-900/95">
            <div class="p-4 border-b border-blue-500/30 flex items-center justify-between">
                <h2 class="text-base font-black text-white">Medidores U. del Magdalena</h2>
                <button id="closePublicSidebar" class="text-gray-400 hover:text-white"><i class="fas fa-times"></i></button>
            </div>
            <div class="scroll flex-1 p-4 space-y-3" id="publicMedidoresList"></div>
        </aside>

        <!-- BARRA LATERAL ADMIN -->
        <aside id="sidebar" class="sidebar glass z-50 border-r border-blue-500/20 bg-slate-900/95">
            <div class="p-4 border-b border-blue-500/20 flex items-center justify-between">
                <h2 class="text-base font-bold text-blue-500">Panel Administrador</h2>
                <button id="closeAdmin" class="text-gray-400 hover:text-white"><i class="fas fa-minus"></i></button>
            </div>
            <div class="scroll flex-1 p-4 space-y-4">
                <p class="text-xs text-gray-300">Modo Administración Activo. Al abrir la Galería podrás eliminar e insertar imágenes a tu gusto.</p>
            </div>
        </aside>
    </div>

    <script>
        // Estado Global de la Galería y Administrador
        let isAdmin = true; // Habilitado para administrar
        let currentGalleryImages = [];
        let currentImageIndex = 0;
        let currentHotspotData = null;

        function showToast(msg) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerText = msg;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        // Abrir Galería
        function openGallery(imagesArray, hotspot = null) {
            currentGalleryImages = imagesArray || [];
            currentImageIndex = 0;
            currentHotspotData = hotspot;
            
            if (currentGalleryImages.length === 0 && !isAdmin) {
                showToast("Este medidor no contiene imágenes en la galería.");
                return;
            }

            updateGalleryUI();
            document.getElementById('fullGalleryModal').classList.add('active');
        }

        function openGalleryFromModal() {
            document.getElementById('infoHotspotModal').classList.remove('active');
            // Ejemplo con imágenes de prueba si no hay una lista previa
            const demoImages = currentHotspotData?.gallery || [
                "https://picsum.photos/800/600?random=1",
                "https://picsum.photos/800/600?random=2"
            ];
            openGallery(demoImages, currentHotspotData);
        }

        function closeGalleryModal() {
            document.getElementById('fullGalleryModal').classList.remove('active');
        }

        // Actualizar elementos de la vista de la galería
        function updateGalleryUI() {
            const imgEl = document.getElementById('fullGalleryImg');
            const counterEl = document.getElementById('galleryCounter');
            const btnAdd = document.getElementById('btnAdminAddImg');
            const btnDel = document.getElementById('btnAdminDeleteImg');

            if (isAdmin) {
                btnAdd.classList.remove('hidden');
                if (currentGalleryImages.length > 0) {
                    btnDel.classList.remove('hidden');
                } else {
                    btnDel.classList.add('hidden');
                }
            } else {
                btnAdd.classList.add('hidden');
                btnDel.classList.add('hidden');
            }

            if (currentGalleryImages.length > 0) {
                imgEl.src = currentGalleryImages[currentImageIndex];
                imgEl.classList.remove('hidden');
                counterEl.innerText = `${currentImageIndex + 1} / ${currentGalleryImages.length}`;
            } else {
                imgEl.src = "";
                imgEl.classList.add('hidden');
                counterEl.innerText = "Sin Imágenes";
            }
        }

        function navigateGallery(step) {
            if (currentGalleryImages.length === 0) return;
            currentImageIndex = (currentImageIndex + step + currentGalleryImages.length) % currentGalleryImages.length;
            updateGalleryUI();
        }

        // Funciones de Edición para Administrador
        function triggerAddGalleryImg() {
            document.getElementById('adminGalleryFileInput').click();
        }

        function handleAdminGalleryUpload(event) {
            const files = event.target.files;
            if (!files || files.length === 0) return;

            for (let i = 0; i < files.length; i++) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    currentGalleryImages.push(e.target.result);
                    currentImageIndex = currentGalleryImages.length - 1;
                    updateGalleryUI();
                    showToast("Imagen agregada a la galería.");
                };
                reader.readAsDataURL(files[i]);
            }
            event.target.value = "";
        }

        function deleteCurrentGalleryImg() {
            if (currentGalleryImages.length === 0) return;
            
            if (confirm("¿Estás seguro de borrar esta imagen de la galería?")) {
                currentGalleryImages.splice(currentImageIndex, 1);
                if (currentImageIndex >= currentGalleryImages.length) {
                    currentImageIndex = Math.max(0, currentGalleryImages.length - 1);
                }
                updateGalleryUI();
                showToast("Imagen eliminada.");
            }
        }

        // Toggles de barras laterales
        document.getElementById('btnOpenPublicSidebar').addEventListener('click', () => {
            document.getElementById('publicSidebar').classList.toggle('open');
        });
        document.getElementById('closePublicSidebar').addEventListener('click', () => {
            document.getElementById('publicSidebar').classList.remove('open');
        });
        document.getElementById('closeAdmin').addEventListener('click', () => {
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('btnMaximizeAdmin').classList.remove('hidden');
        });
        document.getElementById('btnMaximizeAdmin').addEventListener('click', () => {
            document.getElementById('sidebar').classList.add('open');
            document.getElementById('btnMaximizeAdmin').classList.add('hidden');
        });
    </script>
</body>
</html>
